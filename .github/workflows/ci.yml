# ─────────────────────────────────────────────────────────────────────────────
# 本仓库自己的 CI —— founder-saas-kit 用自己的门禁治理自己（dogfooding）。
#
# 这不是模板（模板是 .github/ci.example.yml，特意放在 workflows/ 外，免得 GitHub 把模板也当真 workflow 跑）。
# 这个文件真实生效：每次 PR / push 到 main|dev，云端就跑 kit 自带的护城河门禁。
# README / AGENTS 里说「CI 跑的就是它自带的门禁脚本」，靠的就是本文件坐实。
#
# 跑的全是 kit 零依赖的纯 Node 脚本，无需数据库 / 浏览器 / 任何 npm 依赖。
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  gates:
    name: 护城河门禁（dogfood）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # kit 本身零运行时依赖，无需 npm ci。

      # 守卫自测：两个 PreToolUse 守卫的拦截逻辑没被改坏（护城河的报警器接电）。
      - name: 守卫自测（test:guards · 应 42/42）
        run: npm run test:guards

      # 统一门禁：密钥扫描 + 文档断链 + i18n 一致性 + schema + 结构 + 测试，一条命令。
      - name: 质量门禁聚合（harness · 应 6/6）
        run: npm run harness

      # demo 兜底：确保「30 秒看它干活」那条命令始终能跑（守卫拦截 / 密钥抓取 / 自测）。
      - name: 演示自检（demo）
        run: npm run demo
